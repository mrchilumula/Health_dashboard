services:
  - type: web
    name: health-twin-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health-records/status
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: health-twin-db
          property: connectionString

databases:
  - name: health-twin-db
    databaseName: health_twin
    plan: free
